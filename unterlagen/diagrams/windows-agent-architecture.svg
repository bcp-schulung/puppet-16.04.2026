<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="100%" style="background:#fff;font-family:trebuchet ms,verdana,arial,sans-serif;">
  <!-- Title -->
  <text x="480" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">Puppet Agent on Windows — Architecture Overview</text>

  <!-- Puppet Server box -->
  <rect x="30" y="70" width="220" height="340" rx="10" fill="#ECECFF" stroke="#9370DB" stroke-width="2"/>
  <text x="140" y="95" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Puppet Server</text>
  <text x="140" y="112" text-anchor="middle" font-size="11" fill="#666">(Linux)</text>
  <rect x="50" y="125" width="180" height="32" rx="5" fill="#d4c5f9" stroke="#9370DB" stroke-width="1"/>
  <text x="140" y="146" text-anchor="middle" font-size="12" fill="#333">Catalog Compiler</text>
  <rect x="50" y="167" width="180" height="32" rx="5" fill="#d4c5f9" stroke="#9370DB" stroke-width="1"/>
  <text x="140" y="188" text-anchor="middle" font-size="12" fill="#333">Certificate Authority</text>
  <rect x="50" y="209" width="180" height="32" rx="5" fill="#d4c5f9" stroke="#9370DB" stroke-width="1"/>
  <text x="140" y="230" text-anchor="middle" font-size="12" fill="#333">File Server</text>
  <rect x="50" y="251" width="180" height="32" rx="5" fill="#d4c5f9" stroke="#9370DB" stroke-width="1"/>
  <text x="140" y="272" text-anchor="middle" font-size="12" fill="#333">PuppetDB Connector</text>
  <rect x="50" y="293" width="180" height="32" rx="5" fill="#d4c5f9" stroke="#9370DB" stroke-width="1"/>
  <text x="140" y="314" text-anchor="middle" font-size="12" fill="#333">Hiera Data Lookup</text>
  <text x="140" y="365" text-anchor="middle" font-size="11" fill="#888">Port 8140 (HTTPS)</text>
  <text x="140" y="382" text-anchor="middle" font-size="11" fill="#888">TLS client cert auth</text>

  <!-- Arrow: Server → Agent -->
  <line x1="250" y1="250" x2="360" y2="250" stroke="#555" stroke-width="2" marker-end="url(#arr)"/>
  <text x="305" y="240" text-anchor="middle" font-size="11" fill="#555">HTTPS/8140</text>
  <text x="305" y="265" text-anchor="middle" font-size="11" fill="#555">SSL/TLS</text>

  <!-- Arrow: Agent → Server -->
  <line x1="360" y1="270" x2="250" y2="270" stroke="#555" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Windows Agent box -->
  <rect x="360" y="70" width="260" height="380" rx="10" fill="#e8f5e9" stroke="#388e3c" stroke-width="2"/>
  <text x="490" y="95" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Windows Node</text>
  <text x="490" y="113" text-anchor="middle" font-size="11" fill="#666">puppet-agent (AIO)</text>

  <rect x="375" y="125" width="230" height="30" rx="5" fill="#c8e6c9" stroke="#388e3c" stroke-width="1"/>
  <text x="490" y="145" text-anchor="middle" font-size="12" fill="#333">puppet.exe  (agent daemon)</text>

  <rect x="375" y="163" width="230" height="30" rx="5" fill="#c8e6c9" stroke="#388e3c" stroke-width="1"/>
  <text x="490" y="183" text-anchor="middle" font-size="12" fill="#333">facter.exe  (fact collection)</text>

  <rect x="375" y="201" width="230" height="30" rx="5" fill="#c8e6c9" stroke="#388e3c" stroke-width="1"/>
  <text x="490" y="221" text-anchor="middle" font-size="12" fill="#333">Ruby runtime (bundled)</text>

  <rect x="375" y="239" width="110" height="30" rx="5" fill="#a5d6a7" stroke="#388e3c" stroke-width="1"/>
  <text x="430" y="259" text-anchor="middle" font-size="11" fill="#333">Providers</text>
  <rect x="495" y="239" width="110" height="30" rx="5" fill="#a5d6a7" stroke="#388e3c" stroke-width="1"/>
  <text x="550" y="259" text-anchor="middle" font-size="11" fill="#333">Resources</text>

  <rect x="375" y="277" width="230" height="30" rx="5" fill="#c8e6c9" stroke="#388e3c" stroke-width="1"/>
  <text x="490" y="297" text-anchor="middle" font-size="12" fill="#333">PowerShell bridge</text>

  <rect x="375" y="315" width="230" height="30" rx="5" fill="#c8e6c9" stroke="#388e3c" stroke-width="1"/>
  <text x="490" y="335" text-anchor="middle" font-size="12" fill="#333">Windows Registry access</text>

  <rect x="375" y="353" width="230" height="30" rx="5" fill="#c8e6c9" stroke="#388e3c" stroke-width="1"/>
  <text x="490" y="373" text-anchor="middle" font-size="12" fill="#333">DSC bridge (optional)</text>

  <text x="490" y="430" text-anchor="middle" font-size="11" fill="#888">Runs as SYSTEM or named account</text>
  <text x="490" y="447" text-anchor="middle" font-size="11" fill="#888">C:\ProgramData\PuppetLabs\</text>

  <!-- Arrow: Agent → OS -->
  <line x1="620" y1="260" x2="710" y2="260" stroke="#555" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Windows OS box -->
  <rect x="710" y="70" width="220" height="340" rx="10" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
  <text x="820" y="95" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Windows OS</text>
  <rect x="725" y="110" width="190" height="30" rx="5" fill="#ffe0b2" stroke="#e65100" stroke-width="1"/>
  <text x="820" y="130" text-anchor="middle" font-size="12" fill="#333">NTFS File System</text>
  <rect x="725" y="148" width="190" height="30" rx="5" fill="#ffe0b2" stroke="#e65100" stroke-width="1"/>
  <text x="820" y="168" text-anchor="middle" font-size="12" fill="#333">Windows Registry</text>
  <rect x="725" y="186" width="190" height="30" rx="5" fill="#ffe0b2" stroke="#e65100" stroke-width="1"/>
  <text x="820" y="206" text-anchor="middle" font-size="12" fill="#333">Service Control Manager</text>
  <rect x="725" y="224" width="190" height="30" rx="5" fill="#ffe0b2" stroke="#e65100" stroke-width="1"/>
  <text x="820" y="244" text-anchor="middle" font-size="12" fill="#333">Local Users &amp; Groups</text>
  <rect x="725" y="262" width="190" height="30" rx="5" fill="#ffe0b2" stroke="#e65100" stroke-width="1"/>
  <text x="820" y="282" text-anchor="middle" font-size="12" fill="#333">ACL / DACL / SACL</text>
  <rect x="725" y="300" width="190" height="30" rx="5" fill="#ffe0b2" stroke="#e65100" stroke-width="1"/>
  <text x="820" y="320" text-anchor="middle" font-size="12" fill="#333">PowerShell / WMI</text>
  <rect x="725" y="338" width="190" height="30" rx="5" fill="#ffe0b2" stroke="#e65100" stroke-width="1"/>
  <text x="820" y="358" text-anchor="middle" font-size="12" fill="#333">DSC Engine (LCM)</text>

  <!-- arrow marker -->
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
  </defs>
</svg>
