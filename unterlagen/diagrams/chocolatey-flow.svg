<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" style="background:#fff;font-family:trebuchet ms,verdana,arial,sans-serif;">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
  </defs>
  <text x="450" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#333">Chocolatey Package Management Flow with Puppet</text>

  <!-- Puppet manifest -->
  <rect x="30" y="55" width="200" height="75" rx="8" fill="#ECECFF" stroke="#9370DB" stroke-width="2"/>
  <text x="130" y="77" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Puppet Manifest</text>
  <text x="130" y="96" text-anchor="middle" font-size="11" fill="#444">package { 'git':</text>
  <text x="130" y="112" text-anchor="middle" font-size="11" fill="#444">  provider =&gt; chocolatey,</text>
  <text x="130" y="125" text-anchor="middle" font-size="11" fill="#444">  ensure   =&gt; '2.43.0', }</text>

  <line x1="230" y1="92" x2="290" y2="92" stroke="#555" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Chocolatey provider -->
  <rect x="290" y="55" width="200" height="75" rx="8" fill="#d4c5f9" stroke="#9370DB" stroke-width="1.5"/>
  <text x="390" y="77" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Chocolatey Provider</text>
  <text x="390" y="96" text-anchor="middle" font-size="11" fill="#555">maps ensure =&gt; version</text>
  <text x="390" y="112" text-anchor="middle" font-size="11" fill="#555">calls choco.exe</text>
  <text x="390" y="125" text-anchor="middle" font-size="11" fill="#555">parses output</text>

  <line x1="490" y1="92" x2="550" y2="92" stroke="#555" stroke-width="2" marker-end="url(#arr)"/>

  <!-- choco.exe -->
  <rect x="550" y="55" width="180" height="75" rx="8" fill="#c8e6c9" stroke="#388e3c" stroke-width="1.5"/>
  <text x="640" y="77" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">choco.exe</text>
  <text x="640" y="96" text-anchor="middle" font-size="11" fill="#555">choco install git</text>
  <text x="640" y="112" text-anchor="middle" font-size="11" fill="#555"> --version 2.43.0</text>
  <text x="640" y="125" text-anchor="middle" font-size="11" fill="#555"> --yes --no-progress</text>

  <line x1="730" y1="92" x2="790" y2="92" stroke="#555" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Chocolatey source -->
  <rect x="790" y="55" width="90" height="75" rx="8" fill="#ffe0b2" stroke="#e65100" stroke-width="1.5"/>
  <text x="835" y="77" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Source</text>
  <text x="835" y="96" text-anchor="middle" font-size="11" fill="#555">community</text>
  <text x="835" y="112" text-anchor="middle" font-size="11" fill="#555">chocolatey</text>
  <text x="835" y="125" text-anchor="middle" font-size="11" fill="#555">.org</text>

  <!-- Chocolatey source types section -->
  <text x="450" y="172" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Chocolatey Source Types</text>

  <rect x="30" y="185" width="185" height="90" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="122" y="205" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Community Feed</text>
  <text x="122" y="222" text-anchor="middle" font-size="11" fill="#555">chocolatey.org/api/v2</text>
  <text x="122" y="238" text-anchor="middle" font-size="11" fill="#555">9000+ packages</text>
  <text x="122" y="254" text-anchor="middle" font-size="11" fill="#555">public, needs internet</text>
  <text x="122" y="270" text-anchor="middle" font-size="11" fill="#a00">⚠ review before use</text>

  <rect x="230" y="185" width="185" height="90" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="322" y="205" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Nexus / Artifactory</text>
  <text x="322" y="222" text-anchor="middle" font-size="11" fill="#555">Internal NuGet feed</text>
  <text x="322" y="238" text-anchor="middle" font-size="11" fill="#555">Curated, air-gapped</text>
  <text x="322" y="254" text-anchor="middle" font-size="11" fill="#555">mirrors community pkgs</text>
  <text x="322" y="270" text-anchor="middle" font-size="11" fill="#388e3c">✓ recommended for prod</text>

  <rect x="430" y="185" width="185" height="90" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="522" y="205" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Local / UNC Path</text>
  <text x="522" y="222" text-anchor="middle" font-size="11" fill="#555">\\server\chocolatey</text>
  <text x="522" y="238" text-anchor="middle" font-size="11" fill="#555">Offline / lab use</text>
  <text x="522" y="254" text-anchor="middle" font-size="11" fill="#555">Plain .nupkg files</text>
  <text x="522" y="270" text-anchor="middle" font-size="11" fill="#555">No server required</text>

  <rect x="630" y="185" width="185" height="90" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="722" y="205" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Chocolatey Pro/Business</text>
  <text x="722" y="222" text-anchor="middle" font-size="11" fill="#555">Licensed edition</text>
  <text x="722" y="238" text-anchor="middle" font-size="11" fill="#555">Package internalizer</text>
  <text x="722" y="254" text-anchor="middle" font-size="11" fill="#555">GUI + MSI transform</text>
  <text x="722" y="270" text-anchor="middle" font-size="11" fill="#555">Enhanced security</text>

  <!-- Ensure values section -->
  <text x="450" y="315" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Package ensure Values</text>

  <rect x="30" y="328" width="840" height="85" rx="8" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="1.5"/>
  <text x="55" y="352" font-size="12" font-weight="bold" fill="#7b1fa2">ensure =&gt;</text>
  <text x="55" y="372" font-size="11" fill="#333">installed        →  install if absent (any version)</text>
  <text x="55" y="390" font-size="11" fill="#333">present          →  synonym for installed</text>
  <text x="55" y="406" font-size="11" fill="#333">absent           →  uninstall the package</text>

  <text x="330" y="352" font-size="12" font-weight="bold" fill="#7b1fa2">Version pinning:</text>
  <text x="330" y="372" font-size="11" fill="#333">'2.43.0'         →  install exact version (upgrade if lower)</text>
  <text x="330" y="390" font-size="11" fill="#333">latest           →  always upgrade to newest</text>
  <text x="330" y="406" font-size="11" fill="#333">held             →  (Pro) prevent upgrades</text>

  <text x="630" y="352" font-size="12" font-weight="bold" fill="#7b1fa2">Tip:</text>
  <text x="630" y="372" font-size="11" fill="#333">Pin versions in</text>
  <text x="630" y="388" font-size="11" fill="#333">Hiera per node or</text>
  <text x="630" y="404" font-size="11" fill="#333">role for control</text>
</svg>
